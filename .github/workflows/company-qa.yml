name: Company site QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: company-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Company 24 viewport and interaction checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QA_BROWSER: chromium
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run check
      - name: Run existing browser QA
        env:
          QA_OUT: ${{ runner.temp }}/company-qa
        run: |
          set -o pipefail
          mkdir -p "$QA_OUT"
          npm test 2>&1 | tee "$QA_OUT/qa.log"
      - name: Save screenshots and results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: company-qa-${{ github.sha }}
          path: |
            ${{ runner.temp }}/company-qa/*.png
            ${{ runner.temp }}/company-qa/result.json
            ${{ runner.temp }}/company-qa/qa.log
          if-no-files-found: warn
          retention-days: 7
